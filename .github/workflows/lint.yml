name: Lint

on:
  push:
    paths:
      - 'src/**'
      - 'include/**'
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'

jobs:
  cpplint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cpplint
        run: pip install cpplint

      - name: Run cpplint
        run: |
          cpplint --recursive --filter=-build/include_subdir src/ include/
